site:
  description: Documentation, guides, and tutorials for the Velox Go HTTP router.
  edit_url: https://github.com/example/velox/edit/main/content
  heading_links: true
  language: en
  title: Velox Docs
  title_delimiter: '|'
  url: http://localhost:4727
social:
- icon: github
  label: GitHub
  url: https://github.com/example/velox
- icon: message-circle
  label: Discord
  url: https://discord.gg/velox
theme:
  preset: "docs"
  dark: true
toc:
  enabled: true
  max_level: 4
  min_level: 2
sidebar:
  auto_generate: true
  badges: true
  collapsed: false
  pagination: true
header:
  links:
  - label: Tags
    url: /tags/
  - label: Authors
    url: /authors/
  - label: Changelog
    url: /blog
  - external: true
    label: GitHub
    url: https://github.com/example/velox
  search: true
  social: true
  theme_toggle: true
footer:
  credits: true
  links:
  - label: Privacy
    url: /about
  - label: Contributing
    url: /docs/guide/advanced/middleware
  text: 2025 The Velox Project. MIT License.
build:
  clean: true
  drafts: false
  feed: true
  future: false
  last_updated: mtime
  minify: false
  output: dist
markdown:
  github_alerts: true
  katex: true
  mermaid: true
  triple_colon_callouts: true
  typographer: true
  unsafe: false
images:
  formats:
  - webp
  lazy_loading: true
  quality: 85
  widths:
  - 400
  - 800
  - 1200
search:
  enabled: true
  provider: orama
collections:
  blog:
    feed: true
    layout: default
    paginate: 3
    sort: date desc
  courses:
    layout: docs
    sidebar:
      collapsible: true
      max_depth: 3
    sort: weight asc
  docs:
    layout: docs
    prev_next:
      enabled: true
      labels:
      - Previous
      - Next
    sidebar:
      collapsed_by_default: false
      collapsible: true
      max_depth: 4
      search: true
    sort: weight asc
    tabs: true
    toc:
      depth: 4
      enabled: true
      scroll_highlight: true
    versioning:
      enabled: true
      versions:
      - banner: unmaintained
        id: v1
        label: v1.x
        redirect: root
taxonomies:
  categories: category
  tags: tag
  authors: author
redirects:
  /perf: /blog/2024-06-10-performance-tips
  /start: /docs/guide/introduction
homepage:
  hero:
    background: gradient
    cta:
      label: Get Started
      url: /docs/guide/introduction
    code:
      body: |
        r := velox.New()
        r.Use(middleware.Recoverer())
        r.GET("/users/:id", getUser)
        http.ListenAndServe(":8080", r)
      language: go
      title: Quick start
    eyebrow: Go HTTP Router
    secondary_cta:
      label: GitHub
      url: https://github.com/example/velox
    stats:
    - label: heap allocations
      value: "0"
    - label: route matching
      value: "<1us"
    - label: registered routes
      value: 10k+
    subtitle: A blazing-fast Go HTTP router with zero allocations on the hot path.
    title: Velox
  template: hero
plugins:
  config:
    announcements:
      display_mode: rotate
      items:
      - active: true
        dismissible: true
        end_date: 2027-12-31T23:59:59Z
        id: v2-release
        message: announcements.v2_release
        start_date: 2025-01-01T00:00:00Z
        type: info
      - active: true
        dismissible: true
        id: docs-update
        message: announcements.docs_update
        show_on:
        - /docs/**
        type: success
      - active: true
        dismissible: false
        hide_on:
        - /blog/**
        id: maintenance
        message: announcements.maintenance
        type: warning
      rotate_interval: 6000
      show_rotate_indicator: true
    code-collapsible:
      line_threshold: 12
      preview_lines: 6
    robots:
      disallow:
      - /drafts/
      user_agent: '*'
    rss:
      full_content: true
    scroll-to-top:
      showProgressRing: true
      threshold: 25
  enabled:
  - sitemap
  - robots
  - rss
  - atom
  - search
  - seo
  - redirects
  - link_checker
  - content_lint
  - llms_txt
  - katex
  - mermaid
  - scroll-to-top
  - copy-section-link
  - external-links
  - image-lightbox
  - keyboard-nav
  - focus-mode
  - reading-progress
  - search-highlighter
  - text-highlighter
  - toc-progress
  - last-updated
  - reading-position-memory
  - reading-preferences
  - code-fullscreen
  - code-collapsible
  - announcements
head:
  custom_css:
  - /css/custom.css
i18n:
  default_language: en
  languages:
    ar:
      dir: rtl
      name: العربية
      weight: 3
    en:
      name: English
      weight: 1
    fr:
      name: Français
      weight: 2
server:
  live_reload: true
  port: 4727
link_validation:
  check_anchors: true
  enabled: true
  ignore:
  - https://discord.gg/
  - https://github.com/
  level: warn
content_lint:
  enabled: true
  rules:
    frontmatter_required:
    - title
    heading_increment: true
    heading_max_length: 70
    image_alt_required: true
    no_empty_links: true
llms_txt:
  enabled: true
  include_blog: true
