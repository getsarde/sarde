<!DOCTYPE html>
<html lang="{{ .Lang }}" dir="{{ .Dir }}">
<head>
  <script>(function(){var t=localStorage.getItem('sd-theme')||'system';var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')})()</script>
  {{ component "Head" . }}
</head>
<body class="sarde-layout-{{ .Layout }} starter-theme">
  {{ component "Header" . }}
  <main>
    {{ component "FallbackNotice" . }}
    {{ component "PageBanner" . }}
    {{ block "content" . }}{{ .Page.Content }}{{ end }}
  </main>
  {{ component "Footer" . }}
  {{ announcementBanner }}
  {{ component "Scripts" . }}
</body>
</html>
