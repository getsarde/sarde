site:
  title: "Forest Theme"
  description: "Sarde theme preview — forest preset."
  url: "http://localhost:4727"
  language: "en"
  heading_links: true

theme:
  preset: "forest"
  dark: true

collections:
  docs:
    layout: "docs"
    sort: "weight asc"
    sidebar: { collapsible: true, max_depth: 3 }
    toc: { enabled: true }
    prev_next: { enabled: true }
  blog:
    sort: "date desc"
    feed: true

homepage:
  template: "catalog"
  hero:
    title: "Forest Theme"
    subtitle: "Fresh green primary inspired by nature."
    cta: { label: "Get Started", url: "/docs/getting-started" }

plugins:
  enabled: [sitemap, search, seo]
build:
  minify: false
server:
  port: 4727
  live_reload: true
markdown:
  triple_colon_callouts: true
  typographer: true
