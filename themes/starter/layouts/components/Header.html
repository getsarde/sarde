<header class="sarde-header">
  <a href="/" class="starter-site-title">
    <span class="starter-site-title-mark" aria-hidden="true">
      {{- if .Site.Title }}{{ slice .Site.Title 0 1 | upper }}{{ else }}S{{ end -}}
    </span>
    {{ .Site.Title }}
  </a>
  {{ component "GlobalNav" . }}
  <div class="sarde-header-actions">
    {{ component "Search" . }}
    {{ component "VersionSwitcher" . }}
    {{ component "LanguageSwitcher" . }}
    {{ component "ThemeToggle" . }}
  </div>
</header>
