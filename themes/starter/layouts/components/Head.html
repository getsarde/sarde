<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .Page }}{{ if .Page.Title }}{{ .Page.Title }} {{ .Site.Config.Site.TitleDelimiter }} {{ end }}{{ end }}{{ .Site.Title }}</title>
{{ if .Page }}{{ if .Page.Description }}<meta name="description" content="{{ .Page.Description }}">{{ end }}{{ end }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{ partial "seo.html" . }}
{{ themeStyles . }}
{{ range .Styles }}<link rel="stylesheet" href="{{ . }}">
{{ end }}
{{ if .Page }}{{ if .Page.Params }}{{ renderHeadTags (index .Page.Params "head") }}{{ end }}{{ end }}
