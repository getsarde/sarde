<!DOCTYPE html>
<html lang="{{ .Lang }}" dir="{{ .Dir }}">
<head>
  <script>if(localStorage.getItem('fb-theme')==='dark'||(localStorage.getItem('fb-theme')!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')</script>
  {{ component "Head" . }}
</head>
<body class="layout-{{ .Layout }}">
  {{ component "Header" . }}
  <main>
    {{ block "content" . }}{{ .Page.Content }}{{ end }}
  </main>
  {{ component "Footer" . }}
</body>
</html>
