{{ define "content" }}
<article class="sarde-markdown-content"{{ if and .Page .Page.IsFallback }} dir="ltr"{{ end }}>
  {{ component "PageTitle" . }}
  {{ .Page.Content }}
  {{ component "EditLink" . }}
  {{ component "LastUpdated" . }}
  {{ if .Pagination }}{{ component "Pagination" . }}{{ end }}
</article>
{{ end }}
