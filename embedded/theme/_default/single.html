{{ define "content" }}
<article class="sarde-markdown-content"{{ if and .Page .Page.IsFallback }} dir="ltr"{{ end }}{{ if and .Page .Page.Updated (not .Page.Updated.IsZero) .Page.ShowUpdated }} data-last-modified="{{ .Page.Updated.Unix }}" data-last-updated-label="{{ t `last_updated_label` }}"{{ end }}>
  {{ component "PageTitle" . }}
  {{ .Page.Content }}
  {{ component "EditLink" . }}
  {{ if .Pagination }}{{ component "Pagination" . }}{{ end }}
</article>
{{ end }}
