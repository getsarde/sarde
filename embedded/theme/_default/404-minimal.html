{{ define "content" }}
<div class="sarde-error-page error-page--minimal">
  <h1>{{ if .Page.Content }}{{ .Page.Title }}{{ else }}{{ t "error.not_found" }}{{ end }}</h1>
  {{ if .Page.Content }}
    <div class="sarde-error-page__content">{{ .Page.Content }}</div>
  {{ else }}
    <p>{{ t "error.not_found_desc" }}</p>
  {{ end }}
  <a href="{{ relURL "/" }}">{{ t "error.return_home" }}</a>
</div>
{{ end }}
