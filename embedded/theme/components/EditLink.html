{{ if .Page }}{{ $custom := stringParam .Page.Params "edit_url" }}{{ if $custom }}<a class="sarde-edit-link edit-link" href="{{ $custom }}" rel="noopener">{{ icon "pencil" }}{{ t "edit_this_page" }}</a>{{ else if and .Site.EditURL .Page.RelPath (boolParam .Page.Params "edit_url" true) }}<a class="sarde-edit-link edit-link" href="{{ editURL .Site.EditURL .Page.RelPath }}" rel="noopener">{{ icon "pencil" }}{{ t "edit_this_page" }}</a>{{ end }}{{ end }}
