<!DOCTYPE html>
<html lang="{{ .Lang }}" dir="{{ .Dir }}">
<head>
  <meta charset="utf-8">
  <script>(function(){var t=localStorage.getItem('sd-theme')||'system';var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')})()</script>
  {{ component "Head" . }}
</head>
<body class="sarde-layout-presentation">
  <main id="main-content" class="sarde-presentation-main">
    {{ block "content" . }}{{ .Page.Content }}{{ end }}
  </main>
  {{ component "Scripts" . }}
</body>
</html>
