<!DOCTYPE html>
<html lang="{{ .Lang }}" dir="{{ .Dir }}"{{ if not (boolVal .Site.Config.Theme.Dark true) }} data-theme="light" data-sd-light-only{{ end }}>
<head>
  <meta charset="utf-8">
  {{ if boolVal .Site.Config.Theme.Dark true }}<script>(function(){var t=localStorage.getItem('sd-theme')||'system';var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light')})()</script>{{ end }}
  {{ component "Head" . }}
</head>
<body class="sarde-layout-presentation">
  <main id="main-content" class="sarde-presentation-main">
    {{ block "content" . }}{{ .Page.Content }}{{ end }}
  </main>
  {{ component "Scripts" . }}
</body>
</html>
