name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so each page's "Last updated" date comes from git.
          fetch-depth: 0

      - id: pages
        uses: actions/configure-pages@v6

      # Build for the URL GitHub Pages serves this repository from
      # (https://<owner>.github.io/<repo>/, the root for <owner>.github.io,
      # or a custom domain), so sarde.yaml needs no deployment settings.
      - name: Point Sarde at the Pages URL
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "SARDE_SITE_URL=$PAGES_ORIGIN" >> "$GITHUB_ENV"
          echo "SARDE_BUILD_BASE_PATH=$PAGES_BASE_PATH/" >> "$GITHUB_ENV"

      - uses: getsarde/action@v1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
