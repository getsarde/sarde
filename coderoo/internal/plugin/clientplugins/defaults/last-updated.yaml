fields:
  position:
    type: select
    label: "Position"
    hint: "Where to display the last updated badge"
    default: bottom
    options:
      - { value: top, label: "Below title (next to reading time)" }
      - { value: bottom, label: "Bottom (above navigation)" }
  use_relative_time:
    type: toggle
    label: "Relative Time"
    hint: "Show relative time (\"3 days ago\") instead of an absolute date"
    default: true
  date_format:
    type: select
    label: "Date Format"
    hint: "Format used when relative time is off"
    default: short
    options:
      - { value: short, label: "Jan 5, 2026" }
      - { value: long, label: "January 5, 2026" }
      - { value: iso, label: "2026-01-05" }
