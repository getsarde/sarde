fields:
  fullscreen_button_tooltip:
    type: text
    label: "Button Tooltip"
    hint: "Tooltip shown when hovering the fullscreen button"
    default: "Toggle fullscreen view"
  enable_escape_key:
    type: toggle
    label: "Close on Escape Key"
    hint: "Allow pressing Escape to exit fullscreen mode"
    default: true
  exit_on_browser_back:
    type: toggle
    label: "Close on Browser Back"
    hint: "Exit fullscreen when the browser back button is pressed"
    default: true
  show_on_hover_only:
    type: toggle
    label: "Show Button on Hover Only"
    hint: "Only show the fullscreen button when hovering code blocks without titles"
    default: true
  animation_duration:
    type: number
    label: "Animation Duration (ms)"
    hint: "Duration of the open/close animation in milliseconds"
    default: 200
    min: 0
    max: 1000
  min_block_height:
    type: number
    label: "Minimum Block Height (px)"
    hint: "Code blocks shorter than this won't show the fullscreen button"
    default: 60
    min: 0
    max: 500
