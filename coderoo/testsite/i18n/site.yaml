site:
  title: "i18n Test Site"
  description: "Multi-language testsite for LanguageSwitcher and FallbackNotice"
  language: "en"

theme:
  dark: true

i18n:
  default_language: "en"
  languages:
    en:
      name: "English"
      weight: 1
    fr:
      name: "Français"
      weight: 2
    ar:
      name: "العربية"
      weight: 3
      dir: "rtl"

collections:
  docs:
    layout: "docs"
    sort: "weight asc"
    sidebar:
      collapsible: true
    toc:
      enabled: true
    prev_next:
      enabled: true
  blog:
    sort: "date desc"

plugins:
  enabled:
    - sitemap
    - search
    - seo

build:
  minify: false
