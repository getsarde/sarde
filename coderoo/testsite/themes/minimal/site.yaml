site:
  title: "Minimal Theme"
  description: "Coderoo theme preview — minimal preset."
  url: "http://localhost:4727"
  language: "en"
  heading_links: true

theme:
  preset: "minimal"
  dark: true

collections:
  docs:
    layout: "docs"
    sort: "weight asc"
    sidebar: { collapsible: true, max_depth: 3 }
    toc: { enabled: true }
    prev_next: { enabled: true }
  blog:
    sort: "date desc"
    feed: true

homepage:
  template: "minimal"
  hero:
    title: "Minimal Theme"
    subtitle: "Near-zero chroma, system fonts, subtle borders."

plugins:
  enabled: [sitemap, search, seo]
build:
  minify: false
server:
  port: 4727
  live_reload: true
markdown:
  triple_colon_callouts: true
  typographer: true
