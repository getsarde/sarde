{{ if .Page.Headings }}
<nav class="sarde-toc-nav" aria-label="Table of contents">
  <h2>{{ t "nav.toc" }}</h2>
  <ul>
  {{ range .Page.Headings }}
    <li class="sarde-toc-level-{{ .Level }}"><a href="#{{ .ID }}">{{ .Text }}</a></li>
  {{ end }}
  </ul>
  <a href="#" class="sarde-toc-top" aria-label="Back to top">
    {{ icon "chevron-up" "" "width" "12" "height" "12" }}
    Back to top
  </a>
</nav>
{{ end }}
