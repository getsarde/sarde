<footer class="site-footer">
  {{ if .Site.Config.Footer.Links }}
  <nav class="footer-links">
    {{ range .Site.Config.Footer.Links }}
    <a href="{{ .URL }}"{{ if .External }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Label }}</a>
    {{ end }}
  </nav>
  {{ end }}
  <p>&copy; {{ now.Year }} {{ .Site.Title }}</p>
  {{ if boolVal .Site.Config.Footer.Credits false }}
  <p class="credits">Built with <a href="https://sarde.dev" rel="noopener">Sarde</a></p>
  {{ end }}
</footer>
