<footer class="sarde-footer">
  {{ if .Site.Config.Footer.Links }}
  <nav class="sarde-footer-links">
    {{ range .Site.Config.Footer.Links }}
    <a href="{{ if .External }}{{ .URL }}{{ else }}{{ relURL .URL }}{{ end }}"{{ if .External }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Label }}</a>
    {{ end }}
  </nav>
  {{ end }}
  {{ component "Social" . }}
  <p>&copy; {{ now.Year }} {{ .Site.Title }}</p>
  {{ if boolVal .Site.Config.Footer.Credits false }}
  <p class="sarde-credits">Built with <a href="https://sarde.dev" rel="noopener">Sarde</a></p>
  {{ end }}
</footer>
