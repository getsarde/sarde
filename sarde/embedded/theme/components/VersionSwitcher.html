{{ if .Versions }}
<div class="sarde-version-switcher" data-version-switcher>
  <button class="sarde-version-switcher-trigger" data-version-switcher-trigger
    aria-expanded="false" aria-haspopup="true" aria-label="{{ t "nav.version" }}">
    <span class="sarde-version-switcher-current">{{ .VersionLabel }}</span>
    <svg class="sarde-version-switcher-chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <ul class="sarde-version-switcher-menu" data-version-switcher-menu hidden role="menu">
    {{ range .Versions }}
    <li role="none">
      <a href="{{ .URL }}" role="menuitem"
        class="sarde-version-switcher-option{{ if .IsCurrent }} is-active{{ end }}{{ if eq .Banner "unmaintained" }} is-unmaintained{{ end }}{{ if eq .Banner "unreleased" }} is-unreleased{{ end }}"
        {{ if .IsCurrent }}aria-current="true"{{ end }}>
        <span class="sarde-version-switcher-label">{{ .Label }}</span>
        {{ if .IsLatest }}<span class="sarde-version-switcher-badge">{{ t "nav.version_latest" }}</span>{{ end }}
      </a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
