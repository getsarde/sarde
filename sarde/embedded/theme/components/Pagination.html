{{ if .Pagination }}
<nav class="sarde-pagination" aria-label="Page navigation">
  {{ if .Pagination.Prev }}
  <a href="{{ .Pagination.Prev.URL }}" class="sarde-pagination-prev" rel="prev">
    <span class="sarde-pagination-dir">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      Previous
    </span>
    <span class="sarde-pagination-title">{{ .Pagination.Prev.Title }}</span>
  </a>
  {{ else }}
  <span></span>
  {{ end }}
  {{ with .Pagination.Next }}
  <a href="{{ .URL }}" class="sarde-pagination-next" rel="next">
    <span class="sarde-pagination-dir">
      Next
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </span>
    <span class="sarde-pagination-title">{{ .Title }}</span>
  </a>
  {{ end }}
</nav>
{{ end }}
