{{ if or (not .Site.Config) (ne .Site.Config.Search.Provider "disabled") }}
<button type="button" class="sarde-search-trigger" data-search-trigger aria-label="{{ t "nav.search" }}" title="{{ t "nav.search" }}">
  {{ icon "search" }}
  <span class="sarde-search-trigger-text">{{ t "nav.search" }}</span>
  <span class="sarde-search-kbd" aria-hidden="true"><kbd>⌘</kbd><kbd>K</kbd></span>
</button>
<div id="sarde-search-modal" class="sarde-search-modal" role="dialog" aria-modal="true" aria-label="{{ t "nav.search" }}" data-search-version="{{ .Version }}" data-search-lang="{{ .Lang }}" hidden>
  <div class="sarde-search-modal-backdrop" data-search-close></div>
  <div class="sarde-search-modal-panel">
    <input id="sarde-search-input" type="search" autocomplete="off" spellcheck="false" placeholder="{{ t "nav.search" }}" aria-label="{{ t "nav.search" }}">
    <ul id="sarde-search-results" role="listbox" aria-label="{{ t "search.results" }}"></ul>
    <div id="sarde-search-empty" class="sarde-search-empty" hidden>{{ t "search.no_results" }}</div>
    <div class="sarde-search-footer" aria-hidden="true">
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> Navigate</span>
      <span><kbd>&crarr;</kbd> Open</span>
      <span><kbd>Esc</kbd> Close</span>
    </div>
  </div>
</div>
{{ end }}
