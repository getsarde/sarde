{{ range .Scripts }}<script defer src="{{ . }}"></script>
{{ end }}
{{ range .InlineScripts }}<script>{{ . }}</script>
{{ end }}
{{ range .ModuleScripts }}<script type="module" src="{{ . }}"></script>
{{ end }}
{{ if .Site.Config.Analytics.Script }}<script defer src="{{ .Site.Config.Analytics.Script }}"></script>
{{ end }}
{{ if .Site.KazariScriptURL }}<script defer src="{{ .Site.KazariScriptURL }}"></script>{{ end }}
