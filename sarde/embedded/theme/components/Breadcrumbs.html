{{ if .Breadcrumbs }}
<nav class="sarde-breadcrumbs" aria-label="Breadcrumb">
  <ol>
  {{ range .Breadcrumbs }}
    <li>{{ if or .Current (not .URL) }}<span{{ if .Current }} aria-current="page"{{ end }}>{{ .Label }}</span>{{ else }}<a href="{{ .URL }}">{{ .Label }}</a>{{ end }}</li>
  {{ end }}
  </ol>
</nav>
{{ end }}
