{{ if .IsTabbed }}
<div class="sarde-tab-switcher">
  <button class="sarde-tab-trigger" data-docs-tab-trigger aria-expanded="false" aria-haspopup="listbox">
    {{ if .ActiveTab }}
    <span class="sarde-tab-active-label">
      {{ if .ActiveTab.Icon }}<span class="sarde-tab-icon">{{ .ActiveTab.Icon }}</span>{{ end }}
      <span>{{ .ActiveTab.Title }}</span>
    </span>
    {{ else }}
    <span>Select section</span>
    {{ end }}
    <svg class="sarde-tab-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <ul class="sarde-tab-menu" data-docs-tab-menu role="listbox" hidden>
    {{ range .DocsTabs }}
    <li role="option"{{ if and $.ActiveTab (eq .Slug $.ActiveTab.Slug) }} aria-selected="true"{{ end }}>
      <a href="{{ .Permalink }}" class="sarde-tab-option{{ if and $.ActiveTab (eq .Slug $.ActiveTab.Slug) }} is-active{{ end }}">
        {{ if .Icon }}<span class="sarde-tab-icon">{{ .Icon }}</span>{{ end }}
        <span class="sarde-tab-option-text">
          <span class="sarde-tab-option-title">{{ .Title }}</span>
          {{ if .Description }}<span class="sarde-tab-option-desc">{{ .Description }}</span>{{ end }}
        </span>
        {{ if and $.ActiveTab (eq .Slug $.ActiveTab.Slug) }}
        <svg class="sarde-tab-check" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        {{ end }}
      </a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
