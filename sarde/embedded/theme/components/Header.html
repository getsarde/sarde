<header class="sarde-header">
  {{ component "SiteTitle" . }}
  {{ component "GlobalNav" . }}
  <div class="sarde-header-actions">
    {{ component "Search" . }}
    {{ component "VersionSwitcher" . }}
    {{ component "LanguageSwitcher" . }}
    {{ if boolVal .Site.Config.Header.Social true }}
    {{ component "Social" . }}
    {{ end }}
    {{ component "ThemeToggle" . }}
  </div>
</header>
