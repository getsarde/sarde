{{ define "content" }}
<article class="sarde-markdown-content"{{ if and .Page .Page.Updated (not .Page.Updated.IsZero) }} data-last-modified="{{ .Page.Updated.Unix }}"{{ end }}>
  {{ component "PageTitle" . }}
  {{ .Page.Content }}
  {{ component "EditLink" . }}
  {{ if .Pagination }}{{ component "Pagination" . }}{{ end }}
</article>
{{ end }}
