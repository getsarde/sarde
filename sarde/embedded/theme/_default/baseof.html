<!DOCTYPE html>
<html lang="{{ .Lang }}" dir="{{ .Dir }}">
<head>
  <script>if(localStorage.getItem('sd-theme')==='dark'||(localStorage.getItem('sd-theme')!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark');document.documentElement.style.colorScheme='dark'}</script>
  {{ component "Head" . }}
</head>
<body class="sarde-layout-{{ .Layout }}">
  {{ component "Header" . }}
  <main>
    {{ component "FallbackNotice" . }}
    {{ component "PageBanner" . }}
    {{ block "content" . }}{{ .Page.Content }}{{ end }}
  </main>
  {{ component "Footer" . }}
  {{ announcementBanner }}
  {{ component "Scripts" . }}
</body>
</html>
