<!DOCTYPE html>
<html lang="{{ .Lang }}" dir="{{ .Dir }}">
<head>
  <script>(function(){var t=localStorage.getItem('sd-theme')||'system';var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);if(d){document.documentElement.classList.add('dark');document.documentElement.style.colorScheme='dark'}})()</script>
  {{ component "Head" . }}
</head>
<body class="sarde-layout-{{ .Layout }}">
  <a href="#main-content" class="sarde-skip-link">Skip to main content</a>
  {{ component "Header" . }}
  <main id="main-content">
    {{ component "FallbackNotice" . }}
    {{ component "PageBanner" . }}
    {{ block "content" . }}{{ .Page.Content }}{{ end }}
  </main>
  {{ component "Footer" . }}
  {{ announcementBanner }}
  {{ component "Scripts" . }}
</body>
</html>
