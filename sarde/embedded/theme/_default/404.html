{{ define "content" }}
<div class="sarde-error-page error-page--default">
  {{ if .Page.Content }}
    <div class="sarde-error-page__code">404</div>
    <h1>{{ .Page.Title }}</h1>
    <div class="sarde-error-page__content">{{ .Page.Content }}</div>
  {{ else }}
    <div class="sarde-error-page__code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you requested could not be found.</p>
  {{ end }}
  <a href="/" class="sarde-error-page__home">Return to homepage</a>
</div>
{{ end }}
