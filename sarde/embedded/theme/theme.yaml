name: Default
slug: default
version: "1.0.0"
author: Sarde
description: The default Sarde theme with a modern, professional appearance.
license: MIT

tokens:
  bg: "#ffffff"
  bg-surface: "#f8fafc"
  bg-code: "#1e293b"
  text: "#1e293b"
  text-muted: "#64748b"
  border: "#e2e8f0"
  font-sans: "'Inter', system-ui, -apple-system, sans-serif"
  font-mono: "'JetBrains Mono', ui-monospace, monospace"
  radius: "0.5rem"

dark_tokens:
  bg: "#0f172a"
  bg-surface: "#1e293b"
  bg-code: "#0f172a"
  text: "#e2e8f0"
  text-muted: "#94a3b8"
  border: "#334155"

presets:
  ocean:
    name: Ocean
    tokens:
      accent: "#0ea5e9"
      gray-1: "hsl(200, 10%, 94%)"
      gray-2: "hsl(200, 8%, 87%)"
      gray-3: "hsl(200, 7%, 77%)"
      gray-4: "hsl(200, 5%, 60%)"
      gray-5: "hsl(200, 4%, 45%)"
      gray-6: "hsl(200, 8%, 28%)"
      gray-7: "hsl(200, 12%, 14%)"
    dark_tokens:
      accent: "#38bdf8"
  forest:
    name: Forest
    tokens:
      accent: "#16a34a"
      gray-1: "hsl(40, 10%, 94%)"
      gray-2: "hsl(40, 8%, 87%)"
      gray-3: "hsl(40, 7%, 77%)"
      gray-4: "hsl(40, 5%, 60%)"
      gray-5: "hsl(40, 4%, 45%)"
      gray-6: "hsl(40, 8%, 28%)"
      gray-7: "hsl(40, 12%, 14%)"
    dark_tokens:
      accent: "#4ade80"
  rose:
    name: Rose
    tokens:
      accent: "#e11d48"
      gray-1: "hsl(340, 10%, 95%)"
      gray-2: "hsl(340, 8%, 88%)"
      gray-3: "hsl(340, 6%, 78%)"
      gray-4: "hsl(340, 4%, 60%)"
      gray-5: "hsl(340, 3%, 45%)"
      gray-6: "hsl(340, 6%, 28%)"
      gray-7: "hsl(340, 10%, 14%)"
    dark_tokens:
      accent: "#fb7185"

  # --- Full-look presets -------------------------------------------------
  # Each preset below changes colors, typography, and radius together to
  # produce a distinct visual identity while sharing the same layout.

  clean:
    name: Clean
    tokens:
      accent: "#0f766e"
      bg: "#ffffff"
      bg-surface: "#f0fdfa"
      text: "#134e4a"
      text-muted: "#5eead4"
      border: "#ccfbf1"
      font-sans: "'Plus Jakarta Sans', system-ui, sans-serif"
      font-mono: "'Fira Code', ui-monospace, monospace"
      radius: "0.75rem"
    dark_tokens:
      bg: "#042f2e"
      bg-surface: "#0f3d3c"
      text: "#ccfbf1"
      text-muted: "#5eead4"
      border: "#115e59"

  minimal:
    name: Minimal
    tokens:
      accent: "#18181b"
      bg: "#ffffff"
      bg-surface: "#fafafa"
      text: "#18181b"
      text-muted: "#a1a1aa"
      border: "#e4e4e7"
      font-sans: "system-ui, -apple-system, sans-serif"
      font-mono: "ui-monospace, 'SF Mono', monospace"
      radius: "0.375rem"
    dark_tokens:
      accent: "#fafafa"
      bg: "#09090b"
      bg-surface: "#18181b"
      text: "#fafafa"
      text-muted: "#71717a"
      border: "#27272a"

  docs:
    name: Docs
    tokens:
      accent: "#2563eb"
      bg: "#ffffff"
      bg-surface: "#f6f8fa"
      text: "#24292f"
      text-muted: "#656d76"
      border: "#d0d7de"
      font-sans: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-mono: "'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
      radius: "0.375rem"
    dark_tokens:
      bg: "#0d1117"
      bg-surface: "#161b22"
      text: "#e6edf3"
      text-muted: "#8b949e"
      border: "#30363d"

  academic:
    name: Academic
    tokens:
      accent: "#1e40af"
      bg: "#fefefe"
      bg-surface: "#f5f3ef"
      text: "#1c1917"
      text-muted: "#57534e"
      border: "#d6d3d1"
      font-sans: "'Merriweather', 'Georgia', serif"
      font-mono: "'Source Code Pro', ui-monospace, monospace"
      radius: "0.25rem"
    dark_tokens:
      bg: "#1c1917"
      bg-surface: "#292524"
      text: "#e7e5e4"
      text-muted: "#a8a29e"
      border: "#44403c"
