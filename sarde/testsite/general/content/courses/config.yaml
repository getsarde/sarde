frontmatter_schema:
  fields:
    difficulty:
      type: "enum"
      label: "Difficulty Level"
      required: false
      options:
        - "beginner"
        - "intermediate"
        - "advanced"
    duration_minutes:
      type: "int"
      label: "Estimated Duration (minutes)"
      required: false
      min: 5
      max: 480
