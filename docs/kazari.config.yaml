# Kazari code block configuration.
# Docs: https://frostybee.github.io/kazari

# --- Themes ---
themes:
  light: github-light
  dark: github-dark

darkMode:
  kind: selector
  selector: '[data-theme="dark"]'

# --- Toolbar ---
copyButton: true
fullscreenButton: true
wrapButton: true
themeToggleButton: false
languageBadge: true
languageIconMode: none
fileIcons: true

# --- Block Defaults ---
lineNumbers: false

defaults:
  wrap: false
  preserveIndent: true
  hangingIndent: 0
  lineNumbers: false
  frame: auto

# --- Frame Detection ---
frameDetection: true
fileNameExtraction: true
terminalDotStyle: colored
terminalCommentStripping: true

# --- Collapsible ---
# collapsible:
#   lineThreshold: 15
#   previewLines: 5
#   defaultCollapsed: true
#   preserveIndent: true
#   style: github

# --- Language Defaults ---
languageDefaults:
  "bash, sh, zsh":
    frame: terminal

# --- Language Aliases ---
languageAliases:
  js: javascript
  ts: typescript
  py: python

# --- Styling ---
themedScrollbars: true
themedSelection: false
styleReset: true
cascadeLayer: kazari
themeCSSRoot: ":root"
# styleOverrides:
#   radius: "0.5rem"
#   font-family: "'JetBrains Mono Variable', monospace"
#   font-size: "0.875rem"
#   line-height: "1.6"
#   shadow: "0 2px 8px rgba(0,0,0,0.15)"
#   border: "1px solid transparent"
#   code-padding-block: "1rem"
#   code-padding-inline: "1.35rem"

# --- Other ---
tabWidth: 2
minContrast: 5.5
minify: true
dataLineCount: true
contentExclusion: false
mermaidPassThrough: true
links: false
locale: en-US
