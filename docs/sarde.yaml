site:
  title: "Sarde"
  description: "Documentation for Sarde, a zero-config static site generator"
  url: "https://getsarde.github.io"
  edit_url: "https://github.com/getsarde/sarde/edit/main/docs/content"
  # The Lebanese Red woven mark from brand/icon.svg. The navy tile keeps its
  # edges in both themes. The favicon is brand/favicon.ico, copied to
  # public/favicon.ico where auto-detection finds it.
  logo: "/images/sarde-icon.svg"

build:
  # Project site at https://getsarde.github.io/sarde/
  base_path: /sarde/

theme:
  name: "default"
  preset: "docs"

head:
  custom_css:
  - css/custom.css

markdown:
  github_alerts: true
  katex: true
  mermaid: true
  triple_colon_callouts: true
  typographer: true
  unsafe: false
  codeblocks:
    engine: nuri
    light_theme: "github-light"
    dark_theme: "github-dark-default"

collections:
  docs:
    sort: "order"
    tabs: false
    sidebar:
      collapsible: true
      collapsed_by_default: true
toc:
  enabled: false
  max_level: 4
  min_level: 2

plugins:
  enabled:
    - search
    - seo
    - sitemap
    - robots
    - rss
    - atom
    - content_lint
    - link_validator
    - redirects    
    - social_cards
    - scroll-to-top
    - keyboard-nav
  config:
    social_cards:
      # Lebanese Red brand palette from brand/README.md: deep navy tile
      # background, red ribbon accent, warm ivory text.
      bg_color: "#111827"
      accent_color: "#E43D3D"
      text_color: "#F4F1EA"
      logo: "sarde"
      watermark: true
    scroll-to-top:
      showProgressRing: true
      showTooltip: true
    keyboard-nav:
      # Keep arrow-key navigation, drop the on-load hint toast and the
      # chevron arrows pinned to the viewport edges.
      show_hint: false
      show_side_nav: true

homepage:
  hero:
    title: "Sarde Documentation"
    subtitle: "A zero-config, Go-based static site generator that ships as a single binary."
    background: gradient
    cta:
      label: "Get Started"
      url: "/docs/start-here/getting-started"
    secondary_cta:
      label: "Read the Blog"
      url: "/blog/hello-world"
    image:
      light: /images/hero-light.svg
      dark: /images/hero-dark.svg
      alt: "Hero illustration"
social:
- icon: github
  label: GitHub
  url: https://github.com/getsarde/sarde

header:
  links:
  - label: Tags
    url: /tags/  
  - label: Changelog
    url: /docs/changelog  
  search: true
  social: true
  theme_toggle: true
