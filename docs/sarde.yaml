site:
  title: "Sarde"
  description: "Documentation for Sarde, a zero-config static site generator"
  url: "https://getsarde.github.io"

build:
  # Project site at https://getsarde.github.io/sarde/
  base_path: /sarde/

theme:
  name: "default"
  preset: "docs"

collections:
  docs:
    sort: "order"
    tabs: false
    sidebar:
      collapsible: true
      collapsed_by_default: true
toc:
  enabled: false
  max_level: 4
  min_level: 2

plugins:
  enabled:
    - search
    - seo
    - sitemap
    - robots
    - rss
    - atom
    - content_lint
    - link_validator
    - redirects    
    - social_cards
    - keyboard-nav

homepage:
  hero:
    title: "Sarde Documentation"
    subtitle: "A zero-config, Go-based static site generator that ships as a single binary."
    background: gradient
    cta:
      label: "Get Started"
      url: "/docs/start-here/getting-started"
    secondary_cta:
      label: "Read the Blog"
      url: "/blog/hello-world"
    image:
      light: /images/hero-light.svg
      dark: /images/hero-dark.svg
      alt: "Hero illustration"
