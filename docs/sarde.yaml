site:
  title: Sarde
  description: Documentation for Sarde, a static site generator for documentation, course materials, and blogs
  url: https://getsarde.github.io
  edit_url: https://github.com/getsarde/sarde/edit/main/docs/content
  logo: /images/sarde-icon.svg
  favicon: /favicon.ico
build:
  base_path: /sarde/
theme:
  name: default
  preset: docs
  overrides: {}
  dark_overrides: {}
head:
  custom_css:
  - css/custom.css
markdown:
  github_alerts: true
  asides:
    style: galaxy
  katex: true
  mermaid: true
  triple_colon_callouts: true
  typographer: true
  unsafe: false
  codeblocks:
    engine: nuri
    light_theme: github-light
    dark_theme: github-dark-default
collections:
  docs:
    sort: order
    tabs: false
    sidebar:
      collapsible: true
      collapsed_by_default: true
toc:
  enabled: false
  max_level: 4
  min_level: 2
plugins:
  enabled:
  - search
  - seo
  - sitemap
  - robots
  - rss
  - atom
  - content_lint
  - link_validator
  - redirects
  - social_cards
  - scroll_to_top
  - keyboard_nav
  - reading_progress
  - telescope
  - scroll_to_top
  - focus_mode
  - reading_progress
  config:
    social_cards:
      bg_color: '#111827'
      accent_color: '#E43D3D'
      text_color: '#F4F1EA'
      logo: sarde
      logo_size: 96
      watermark: true
    scroll_to_top:
      show_progress_ring: true
      show_tooltip: true
    keyboard_nav:
      show_hint: false
      show_side_nav: true
    reading_progress:
      bar_height: 3.5
      bar_color: '#9122f9'
    scroll_to_top:
      showTooltip: false
      progressRingColor: '#17f207'
      showProgressRing: true
    focus_mode:
      button_position: bottom-left
    reading_progress:
      bar_color: '#caf202'
      use_gradient: false
homepage:
  hero:
    title: Sarde Documentation
    subtitle: Turn a folder of Markdown into a documentation site, a blog, or a course. One Go binary, a few lines of configuration.
    background: gradient
    cta:
      label: Get Started
      url: /docs/start-here/getting-started
      icon: rocket
    secondary_cta:
      label: Star on GitHub
      url: https://github.com/getsarde/sarde
      icon: star
    image:
      light: /images/sarde-icon.svg
      dark: /images/sarde-icon.svg
      alt: The Sarde woven ribbon mark on a navy tile
social:
- icon: github
  label: GitHub
  url: https://github.com/getsarde/sarde
header:
  links:
  - label: Tags
    url: /tags/
  - label: Changelog
    url: /docs/resources/changelog/
  search: true
  social: true
  theme_toggle: true
