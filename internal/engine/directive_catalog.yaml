# Directive catalog — the canonical description of every ::: block directive
# Sarde recognizes, consumed by `sarde directives` and Sarde Studio's
# directive picker and editor autocomplete.
#
# IMPORTANT: entries are derived from each extension's parser grammar
# (internal/content/markdown/extensions/<name>/parser.go), NOT from the docs,
# which contain known syntax errors. Parity with the aside parser's ValidTypes
# is enforced by directive_catalog_test.go.
#
# Field placement values control the exact emitted syntax:
#   attr        key="value"  (values must always be quoted — attrutil.Parse
#               does not recognize unquoted values)
#   bare-flag   key          (attrutil.Has-style booleans)
#   quoted-flag key="true"   (attrutil.Bool-style booleans; omitted when false)
#   bare-icon   " icon=name" (bare word after the bracket — aside family only)
#   paren-flag  literal "(open)" token (details only; hand-rolled regex)
#
# Container directives define child_template (a repeatable nested child with a
# literal N index token), child_default_count, and optionally child_count_field
# naming the field whose value drives the repeat count.

categories:
  - name: callouts
    label: Callouts
    directives:
      - name: note
        label: Note
        description: Blue informational callout
        kind: callout
        bracket: { label: Title, required: false, placeholder: "" }
        fields:
          - { name: icon, label: Icon, type: icon, placement: bare-icon, placeholder: "lucide icon name, e.g. sparkles" }
        body_template: "${content}"
      - name: tip
        label: Tip
        description: Green tip callout
        kind: callout
        bracket: { label: Title, required: false, placeholder: "" }
        fields:
          - { name: icon, label: Icon, type: icon, placement: bare-icon, placeholder: "lucide icon name, e.g. sparkles" }
        body_template: "${content}"
      - name: info
        label: Info
        description: Blue info callout
        kind: callout
        bracket: { label: Title, required: false, placeholder: "" }
        fields:
          - { name: icon, label: Icon, type: icon, placement: bare-icon, placeholder: "lucide icon name, e.g. sparkles" }
        body_template: "${content}"
      - name: warning
        label: Warning
        description: Amber warning callout
        kind: callout
        bracket: { label: Title, required: false, placeholder: "" }
        fields:
          - { name: icon, label: Icon, type: icon, placement: bare-icon, placeholder: "lucide icon name, e.g. sparkles" }
        body_template: "${content}"
      - name: caution
        label: Caution
        description: Amber caution callout
        kind: callout
        bracket: { label: Title, required: false, placeholder: "" }
        fields:
