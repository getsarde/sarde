        body_template: "${content}"
      - name: important
        label: Important
        description: Purple important callout
        kind: callout
        bracket: { label: Title, required: false, placeholder: "" }
        fields:
          - { name: icon, label: Icon, type: icon, placement: bare-icon, placeholder: "lucide icon name, e.g. sparkles" }
        body_template: "${content}"
      - name: danger
        label: Danger
        description: Red danger callout
        kind: callout
        bracket: { label: Title, required: false, placeholder: "" }
        fields:
          - { name: icon, label: Icon, type: icon, placement: bare-icon, placeholder: "lucide icon name, e.g. sparkles" }
        body_template: "${content}"
      - name: gh-note
        label: GitHub Note
        description: GitHub-style note callout
        kind: callout
        bracket: { label: Title, required: false, placeholder: "" }
        fields:
          - { name: icon, label: Icon, type: icon, placement: bare-icon, placeholder: "lucide icon name, e.g. sparkles" }
        body_template: "${content}"
      - name: gh-tip
        label: GitHub Tip
        description: GitHub-style tip callout
        kind: callout
        bracket: { label: Title, required: false, placeholder: "" }
        fields:
          - { name: icon, label: Icon, type: icon, placement: bare-icon, placeholder: "lucide icon name, e.g. sparkles" }
        body_template: "${content}"
      - name: gh-important
        label: GitHub Important
        description: GitHub-style important callout
        kind: callout
        bracket: { label: Title, required: false, placeholder: "" }
        fields:
          - { name: icon, label: Icon, type: icon, placement: bare-icon, placeholder: "lucide icon name, e.g. sparkles" }
        body_template: "${content}"
      - name: gh-warning
        label: GitHub Warning
        description: GitHub-style warning callout
        kind: callout
        bracket: { label: Title, required: false, placeholder: "" }
        fields:
          - { name: icon, label: Icon, type: icon, placement: bare-icon, placeholder: "lucide icon name, e.g. sparkles" }
