fields:
  line_threshold:
    type: number
    label: "Line Threshold"
    hint: "Minimum number of lines before a code block is auto-collapsed"
    default: 15
    min: 1
    max: 200
  preview_lines:
    type: number
    label: "Preview Lines"
    hint: "Number of visible lines when a code block is collapsed"
    default: 8
    min: 1
    max: 50
  default_collapsed:
    type: toggle
    label: "Start Collapsed"
    hint: "Whether long code blocks start in their collapsed state"
    default: true
  expand_button_text:
    type: text
    label: "Expand Button Text"
    hint: "Text shown on the toggle button when code is collapsed"
    default: "Show more"
  collapse_button_text:
    type: text
    label: "Collapse Button Text"
    hint: "Text shown on the toggle button when code is expanded"
    default: "Show less"
