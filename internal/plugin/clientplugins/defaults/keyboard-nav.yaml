fields:
  show_hint:
    type: toggle
    label: "Show Keyboard Hint"
    hint: "Display a brief hint about arrow key navigation on first visit"
    default: true
  show_side_nav:
    type: toggle
    label: "Show Side Navigation Arrows"
    hint: "Display chevron arrows on the left and right edges of the viewport for prev/next navigation"
    default: true
  show_compact_nav:
    type: toggle
    label: "Show Compact Buttons"
    hint: "On screens narrower than 1280px, show small floating prev/next buttons at the viewport edges instead of hiding the side navigation"
    default: true
  show_tooltip:
    type: toggle
    label: "Show Arrow Tooltip"
    hint: "Show the target page title and its arrow key beside a side arrow on hover"
    default: true
  side_nav_size:
    type: select
    label: "Side Arrow Size"
    hint: "Size of the left and right edge navigation arrows"
    default: medium
    options:
      - { value: small, label: "Small" }
      - { value: medium, label: "Medium" }
      - { value: large, label: "Large" }
  auto_hide:
    type: select
    label: "Auto-Hide"
    hint: "Fade the side navigation out after a spell of inactivity and bring it back when the user scrolls"
    default: compact
    options:
      - { value: compact, label: "Compact buttons only" }
      - { value: always, label: "All screen sizes" }
      - { value: "off", label: "Off" }
  hide_delay:
    type: number
    label: "Hide Delay (ms)"
    hint: "Milliseconds of inactivity before the side navigation fades out"
    default: 2000
    min: 500
    max: 10000
  scroll_threshold:
    type: number
    label: "Reveal Threshold (px)"
    hint: "Scroll distance that brings the hidden side navigation back"
    default: 100
    min: 0
    max: 1000
