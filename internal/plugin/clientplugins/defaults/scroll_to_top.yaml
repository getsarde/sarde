fields:
  threshold:
    type: number
    label: "Scroll Threshold (px)"
    hint: "How many pixels the reader must scroll down before the button appears"
    default: 300
    min: 0
    max: 5000
  position:
    type: select
    label: "Button Position"
    hint: "Horizontal position of the button at the bottom of the viewport"
    default: center
    options:
      - { value: left, label: "Bottom Left" }
      - { value: center, label: "Bottom Center" }
      - { value: right, label: "Bottom Right" }
  show_tooltip:
    type: toggle
    label: "Show Tooltip"
    hint: "Display a \"Back to top\" tooltip on hover"
    default: false
  show_progress_ring:
    type: toggle
    label: "Show Progress Ring"
    hint: "Show a circular progress indicator around the button"
    default: false
  border_radius:
    type: number
    label: "Border Radius"
    hint: "Corner rounding as a percentage (0 = square, 50 = circle)"
    default: 15
    min: 0
    max: 50
  smooth_scroll:
    type: toggle
    label: "Smooth Scroll"
    hint: "Use smooth scrolling animation when returning to top"
    default: true
  progress_ring_color:
    type: color
    label: "Progress Ring Color"
    hint: "Custom color for the progress ring. Leave empty for theme default."
    default: ""
