fields:
  threshold:
    type: number
    label: "Scroll Threshold (%)"
    hint: "How far down the page before the button appears"
    default: 30
    min: 10
    max: 99
  show_tooltip:
    type: toggle
    label: "Show Tooltip"
    hint: "Display a \"Back to top\" tooltip on hover"
    default: false
  show_progress_ring:
    type: toggle
    label: "Show Progress Ring"
    hint: "Show a circular progress indicator around the button"
    default: false
  border_radius:
    type: number
    label: "Border Radius"
    hint: "Corner rounding as a percentage (0 = square, 50 = circle)"
    default: 15
    min: 0
    max: 50
  smooth_scroll:
    type: toggle
    label: "Smooth Scroll"
    hint: "Use smooth scrolling animation when returning to top"
    default: true
  progress_ring_color:
    type: color
    label: "Progress Ring Color"
    hint: "Custom color for the progress ring. Leave empty for theme default."
    default: ""
