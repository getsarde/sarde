fields:
  shortcut_key:
    type: text
    label: "Shortcut Key"
    hint: "Key combined with Ctrl (Windows/Linux) or Cmd (Mac) to open the palette"
    default: "/"
  max_results:
    type: number
    label: "Max Search Results"
    hint: "Maximum number of results shown in the Search tab"
    default: 20
    min: 1
    max: 100
  max_recent:
    type: number
    label: "Max Recent Pages Shown"
    hint: "How many recently visited pages the Recent tab lists"
    default: 10
    min: 1
    max: 50
  max_pinned:
    type: number
    label: "Max Pinned Pages"
    hint: "Cap on pinned pages before the oldest pin is evicted"
    default: 50
    min: 1
    max: 200
  debounce_ms:
    type: number
    label: "Search Debounce (ms)"
    hint: "Delay before a keystroke triggers a search"
    default: 120
    min: 0
    max: 1000
  default_tab:
    type: select
    label: "Default Tab"
    hint: "Tab shown when the palette opens"
    default: search
    options:
      - value: search
        label: "Search"
      - value: recent
        label: "Recent"
  exclude:
    type: list
    label: "Excluded Paths"
    hint: "Glob patterns matched against page URLs to leave out of the index"
    default: []
  placeholder:
    type: text
    label: "Search Placeholder"
    hint: "Leave empty to use the default localized placeholder"
    default: ""
